<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境客户邮件智能处理 Agent · 3 分钟讲解</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff;
    --green:#3fb950; --amber:#d29922; --purple:#bc8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 20px 0;
  }
  .wrap{width:100%; max-width:900px; flex:1; display:flex; flex-direction:column}

  /* 顶部进度 */
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:8px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);
        margin-bottom:20px;font-variant-numeric:tabular-nums}
  .steps{display:flex;gap:6px;margin-bottom:18px}
  .steps span{flex:1;height:3px;background:var(--line);border-radius:2px}
  .steps span.on{background:var(--accent)}
  .steps span.done{background:var(--green)}

  /* 主舞台 */
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         padding:28px 30px;margin-bottom:18px;min-height:330px}
  .kicker{font-size:12px;letter-spacing:2px;color:var(--accent);margin-bottom:10px}
  h1{font-size:26px;margin-bottom:6px;line-height:1.3}
  .sub{font-size:14px;color:var(--dim);margin-bottom:22px}

  /* 数据卡 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .card .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .card .l{font-size:12px;color:var(--dim);margin-top:4px}
  .card.g .n{color:var(--green)} .card.a .n{color:var(--amber)}
  .card.p .n{color:var(--purple)} .card.b .n{color:var(--accent)}

  /* 列表 */
  ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  li{font-size:14px;line-height:1.6;padding-left:18px;position:relative;color:#c9d1d9}
  li::before{content:"→";position:absolute;left:0;color:var(--accent);font-size:12px;top:2px}
  li b{color:var(--fg)}
  li.warn::before{content:"!";color:var(--amber);font-weight:700}

  /* 流程条 */
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .flow i{font-style:normal;background:var(--bg);border:1px solid var(--line);
          border-radius:6px;padding:8px 12px;font-size:13px}
  .flow em{font-style:normal;color:var(--dim);font-size:12px}

  /* 演进条 */
  .evo{display:flex;flex-direction:column;gap:14px}
  .evo .row{display:flex;align-items:center;gap:12px;font-size:13px}
  .evo .row .tag{width:130px;color:var(--dim);flex-shrink:0}
  .evo .row .track{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden}
  .evo .row .fill{height:100%;display:flex;align-items:center;padding-left:8px;
                  font-size:12px;font-weight:600;border-radius:4px;
                  transition:width .6s ease}
  .evo .row .val{width:52px;text-align:right;font-variant-numeric:tabular-nums}

  /* 提词器 */
  .tele{background:#0a0d12;border:1px solid var(--line);border-radius:10px;
        padding:18px 22px;margin-bottom:16px}
  .tele .lab{font-size:11px;letter-spacing:2px;color:var(--dim);margin-bottom:10px}
  .tele .txt{font-size:17px;line-height:1.9;color:#e6edf3;min-height:88px}
  .tele .txt .cur{background:rgba(88,166,255,.18);border-radius:3px;padding:1px 2px}

  /* 控制栏 */
  .ctrl{display:flex;gap:10px;align-items:center;justify-content:center;
        padding:16px 0 26px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  button{background:var(--panel);border:1px solid var(--line);color:var(--fg);
         border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;
         font-family:inherit;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.pri{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
  kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:4px;padding:2px 6px;font-size:11px;font-family:inherit}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar"><i id="bar"></i></div>
  <div class="meta">
    <span id="title">跨境客户邮件智能处理 Agent</span>
    <span><span id="clock">0:00</span> / 3:00</span>
  </div>
  <div class="steps" id="steps"></div>

  <div class="stage" id="stage"></div>

  <div class="tele">
    <div class="lab">提词器 · 照着念即可</div>
    <div class="txt" id="tele"></div>
  </div>

  <div class="ctrl">
    <button class="pri" id="play">⏸ 暂停</button>
    <button id="prev">← 上一段</button>
    <button id="next">下一段 →</button>
    <button id="restart">↻ 重播</button>
    <span style="margin-left:8px">
      <kbd>空格</kbd> 暂停 · <kbd>←</kbd><kbd>→</kbd> 切段 · <kbd>R</kbd> 重播
    </span>
  </div>

</div>

<script>
// —— 六段内容：起止秒 / 标题 / 舞台HTML / 口播稿 ——
const S = [
{
  t:25, kicker:"01 · 问题", title:"外贸业务员每天被邮件淹没",
  sub:"读完 → 判断类型 → 抽字段 → 录系统，一封平均 103 秒",
  stage:`
   <div class="flow">
     <i>读英文邮件</i><em>→</em><i>判断类型</i><em>→</em>
     <i>抽 5 个字段</i><em>→</em><i>录进系统</i>
   </div>
   <div class="cards">
     <div class="card a"><div class="n">103 s</div><div class="l">人工处理一封</div></div>
     <div class="card"><div class="n">30 封</div><div class="l">业务员日均</div></div>
     <div class="card a"><div class="n">51 min</div><div class="l">每日耗在这件事上</div></div>
   </div>
   <ul>
     <li>询盘 / 报价 / 索赔 / 催单混在一起，<b>靠人眼分</b></li>
     <li>产品、数量、单价、交期、币种，<b>5 个字段逐个抄</b></li>
     <li>纯事务性劳动，<b>但漏一封就可能丢一个客户</b></li>
   </ul>`,
  speech:"我做的是一个跨境客户邮件智能处理 Agent。背景很具体：外贸业务员每天要处理几十封英文询盘、报价、索赔邮件，读完要判断类型、抽出产品数量价格交期，再录进系统。纯人工，一封平均要 103 秒。我做的这件事，就是把这个流程自动化掉。"
},
{
  t:60, kicker:"02 · 真实数据", title:"接了真实邮箱，才看到真问题",
  sub:"干净数据集里永远不会出现的脏东西",
  stage:`
   <div class="cards">
     <div class="card g"><div class="n">3 封</div><div class="l">Agent Mail 真实收件</div></div>
     <div class="card g"><div class="n">15/15</div><div class="l">真实邮件字段完整度</div></div>
     <div class="card"><div class="n">20 封</div><div class="l">端到端测试集</div></div>
     <div class="card"><div class="n">6 封</div><div class="l">独立歧义样本</div></div>
   </div>
   <ul>
     <li>真实邮件里塞满 <b>HTML 标签、历史引用、多语言混排</b></li>
     <li class="warn">法语金额写法：<b>EUR 24,50</b> —— 逗号是小数点，不是千分位</li>
     <li class="warn">一封邮件里出现 <b>两个数量</b>：缺陷量 180 和订单量 2400</li>
     <li>为此专门写了清洗层，<b>脏数据处理完再进模型</b></li>
   </ul>`,
  speech:"这个项目不是拿自造数据跑的 demo。它接了真实邮箱，用 Agent Mail 连接器收真实邮件处理。接了之后才暴露出问题——真实邮件里有大量 HTML 标签、引用历史、多语言混排，还有法语的金额写法，EUR 用逗号做小数点。这些在干净数据集里永远不会出现。所以我专门写了一个清洗层，把真实邮件的脏数据处理掉再进模型。"
},
{
  t:105, kicker:"03 · 架构", title:"规则层 + LLM 字段级兜底",
  sub:"不全丢给大模型，是为了成本、速度和可解释性",
  stage:`
   <div class="flow">
     <i>邮件进入</i><em>→</em><i style="border-color:var(--green)">规则层</i><em>→</em>
     <i>置信度判定</i><em>→</em>
     <i style="border-color:var(--amber)">LLM 兜底（字段级）</i><em>→</em><i>结构化输出</i>
   </div>
   <div class="cards">
     <div class="card g"><div class="n">0.45 ms</div><div class="l">规则层单封耗时</div></div>
     <div class="card g"><div class="n">¥0</div><div class="l">规则层成本</div></div>
     <div class="card a"><div class="n">省 60%</div><div class="l">字段级兜底省下的调用</div></div>
     <div class="card p"><div class="n">70-80%</div><div class="l">规则层可直接处理占比</div></div>
   </div>
   <ul>
     <li><b>字段级兜底</b>：哪几个字段不确定就只补那几个，不是整封重跑</li>
     <li><b>可解释</b>：客户问「为什么判成索赔」，能指出命中了哪个词</li>
     <li><b>可降级</b>：大模型超时/欠费，自动退回规则层，不崩</li>
   </ul>`,
  speech:"架构上我用了一个双层设计：规则层加 LLM 兜底。为什么不直接全丢给大模型？两个原因：成本和可解释性。规则层处理明确邮件是零成本、0.45 毫秒一封；只有规则判断不了、或者置信度不够的，才调用大模型兜底。而且是字段级兜底——哪几个字段不确定就只补那几个，不是整封重跑。这一层设计把调用成本省了大约 60%。规则还有一个好处：出错能解释。客户问「为什么判定成索赔」，我能指出来是命中了哪个词。"
},
{
  t:140, kicker:"04 · RAG", title:"检索演进：从 40% 到 100%",
  sub:"关键发现：全局调权重是钝刀，得按意图路由",
  stage:`
   <div class="evo">
     <div class="row">
       <span class="tag">BM25 关键词</span>
       <span class="track"><span class="fill" style="width:40%;background:#d29922">40%</span></span>
       <span class="val" style="color:#d29922">40%</span>
     </div>
     <div class="row">
       <span class="tag">+ 向量混合检索</span>
       <span class="track"><span class="fill" style="width:60%;background:#58a6ff">60%</span></span>
       <span class="val" style="color:#58a6ff">60%</span>
     </div>
     <div class="row">
       <span class="tag">+ 意图自适应路由</span>
       <span class="track"><span class="fill" style="width:100%;background:#3fb950">100%</span></span>
       <span class="val" style="color:#3fb950">100%</span>
     </div>
   </div>
   <ul style="margin-top:18px">
     <li>新邮件进来，先查<b>这个客户之前聊过什么、报过什么价</b></li>
     <li class="warn">权重 3.0：语义题修好了，<b>数字题被向量噪声带崩</b></li>
     <li class="warn">权重 1.0：数字题正常，<b>语义题仍然崩</b></li>
     <li><b>解法</b>：金额/数量走关键词，语义类走向量——分而治之</li>
   </ul>`,
  speech:"第二个技术点是 RAG。我给 Agent 加了一层客户历史档案检索——新邮件进来，先查这个客户之前聊过什么、报过什么价，再决定怎么回。检索我走了三步：先做 BM25 关键词检索钉基线，再加向量检索做混合，最后做精排。中间有个关键发现：全局调融合权重是钝刀。权重调高了，语义类问题修好了，但数字类问题被向量噪声带崩。最后我改成按意图路由——涉及金额数量的走关键词，语义类的走向量。语义类召回率从 40% 提到了 100%。"
},
{
  t:165, kicker:"05 · 效果", title:"实测 80.9 倍，每月省 18.6 小时",
  sub:"人工侧透明模型 · 保守下界 · 假设全部落盘可复算",
  stage:`
   <div class="cards">
     <div class="card"><div class="n">102.9 s</div><div class="l">人工处理一封</div></div>
     <div class="card b"><div class="n">1.27 s</div><div class="l">Agent 处理一封</div></div>
     <div class="card g"><div class="n">80.9×</div><div class="l">提效倍数（口径对齐）</div></div>
     <div class="card g"><div class="n">18.6 h</div><div class="l">每月节省工时</div></div>
     <div class="card p"><div class="n">¥1.3</div><div class="l">每月 LLM 成本</div></div>
   </div>
   <ul>
     <li>人工侧<b>不是拍脑袋</b>：逐封按邮件长度计算，假设全部落盘，可改参数重算</li>
     <li>取的是<b>保守下界</b>——真实业务员含切换、回查、中断，实际更慢</li>
     <li>按日均 30 封、月 22 工作日换算</li>
     <li class="warn">另三项工具提效（PDF/Excel/截图）经复核修正后为 <b>3.9-6.3 倍</b>，
         未计入主数字——口径不对等的不混进来</li>
   </ul>`,
  speech:"效果我用真实计时测过，不是估算。人工侧我建了一个透明模型，假设全部落盘可以复算，而且取的是保守下界。结果：人工 102.9 秒一封，Agent 1.27 秒，提效 80.9 倍。按业务员日均 30 封算，每月省回 18.6 小时，而大模型成本每个月大概 1 块 3。"
},
{
  t:180, kicker:"06 · 边界", title:"我不报 100%",
  sub:"知道 AI 在哪儿不能用，和知道在哪儿能用一样重要",
  stage:`
   <div class="cards">
     <div class="card a"><div class="n">83.3%</div><div class="l">独立集真实水平</div></div>
     <div class="card"><div class="n">100%</div><div class="l">测试集（调过参，不作数）</div></div>
     <div class="card a"><div class="n">9 / 10</div><div class="l">施工图纸 PDF 无文字层</div></div>
   </div>
   <ul>
     <li class="warn">测试集的 100% 是<b>看完错误、补完关键词</b>之后达到的</li>
     <li>在<b>从未参与调参</b>的独立样本上：规则层 33.3%，兜底后 <b>83.3%</b></li>
     <li>补词既没损害泛化，也没真正提升泛化——<b>只修好了测试集那一个样本</b></li>
     <li class="warn">实测 10 份公司施工图纸 PDF，<b>9 份是 CAD 矢量导出、无文字层</b>，
         直接提取为空，必须走 OCR</li>
     <li>系统定位是<b>辅助不是替代</b>：低置信度转人工审核</li>
   </ul>`,
  speech:"最后我想主动说一个边界。准确率我不报 100%。测试集上的 100% 是调过参的，在一份从没参与调参的独立样本上，真实水平是 83.3%。另外我实测过公司 10 份施工图纸 PDF，9 份是 CAD 矢量导出、没有文字层，直接提取结果为空——这类必须走 OCR。知道 AI 在哪儿不能用，和知道在哪儿能用，我觉得一样重要。"
}];

const TOTAL = 180;
let now = 0, playing = true, raf = null, last = 0;

const $ = id => document.getElementById(id);

// 步骤条
$("steps").innerHTML = S.map(() => "<span></span>").join("");

function idxAt(t){ let i = 0; for (let k = 0; k < S.length; k++) if (t >= (k? S[k-1].t : 0)) i = k; return i; }

function render(){
  const i = idxAt(now), s = S[i];
  $("stage").innerHTML = `
    <div class="kicker">${s.kicker}</div>
    <h1>${s.title}</h1>
    <div class="sub">${s.sub}</div>
    ${s.stage}`;
  $("tele").innerHTML = s.speech;
  $("bar").style.width = (now / TOTAL * 100).toFixed(2) + "%";
  $("clock").textContent = fmt(now);
  [...$("steps").children].forEach((el, k) => {
    el.className = k < i ? "done" : k === i ? "on" : "";
  });
}

function fmt(s){
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ":" + String(r).padStart(2, "0");
}

function tick(ts){
  if (!playing) return;
  if (!last) last = ts;
  now += (ts - last) / 1000;
  last = ts;
  if (now >= TOTAL){ now = TOTAL; playing = false; $("play").textContent = "▶ 播放"; render(); return; }
  render();
  raf = requestAnimationFrame(tick);
}

function go(t){ now = Math.max(0, Math.min(TOTAL, t)); last = 0; render(); }
function jump(d){
  const i = idxAt(now);
  if (d > 0) go(i + 1 < S.length ? S[i].t : TOTAL);
  else go(i > 0 ? S[i-1].t : 0);
}
function toggle(){
  playing = !playing;
  $("play").textContent = playing ? "⏸ 暂停" : "▶ 播放";
  if (playing){ last = 0; raf = requestAnimationFrame(tick); }
}

$("play").onclick = toggle;
$("next").onclick = () => jump(1);
$("prev").onclick = () => jump(-1);
$("restart").onclick = () => { go(0); if (!playing) toggle(); };

document.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); toggle(); }
  else if (e.code === "ArrowRight"){ e.preventDefault(); jump(1); }
  else if (e.code === "ArrowLeft"){ e.preventDefault(); jump(-1); }
  else if (e.key.toLowerCase() === "r"){ go(0); }
});

render();
raf = requestAnimationFrame(tick);
</script>
</body>
</html>
